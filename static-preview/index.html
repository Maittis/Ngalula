(async function bootstrap(){
  try{
    const res = await fetch('ngalula-unified.jsx');
    const txt = await res.text();
    // Remove import/export lines and replace with local React/Recharts bindings
    let mod = txt.replace(/import[\s\S]*?from\s+"react";?/g, '')
             .replace(/import[\s\S]*?from\s+"recharts";?/g, '')
             .replace(/export default /g, 'function ');
    // Transpile JSX with Babel then evaluate the module source
    try{
      // fix artifacts from replacing `export default` earlier
      mod = mod.replace(/function function/g,'function');
      const transformed = Babel.transform(mod, { presets: ['react'] }).code;
      // eslint-disable-next-line no-eval
      eval(transformed + "\n;ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(NgalulaUnifiedApp));");
    }catch(e){
      throw e;
    }
  }catch(e){
    document.getElementById('root').innerText = 'Failed to load app: ' + e.message;
    console.error(e);
  }
})();
